<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 70" fill="none" role="img" aria-label="TIAM DESIGNS Logo">
  <defs>
    <!-- Hard Action-Game Drop Shadow -->
    <filter id="td-logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3.5" dy="3.5" stdDeviation="0" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="td-accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94cb45"/>
      <stop offset="100%" stop-color="#5c8238"/>
    </linearGradient>
    <linearGradient id="td-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#c44d18"/>
    </linearGradient>
  </defs>

  <g transform="skewX(-9) translate(14, 4)" filter="url(#td-logo-shadow)">
    <!-- ========================================================================
         LAYER 1: 2XKO SIGNATURE HEAVY BOLD CASING (Thick Solid Black Silhouette)
         ======================================================================== -->
    <g stroke="#050608" stroke-width="12" stroke-linejoin="round" stroke-miterlimit="2" fill="#050608">
      <!-- T -->
      <path d="M 12 10 L 50 10 L 50 23 L 37 23 L 37 54 L 25 54 L 25 23 L 12 23 Z" />
      <!-- I -->
      <path d="M 56 10 L 68 10 L 68 54 L 56 54 Z" />
      <!-- A (Smooth Industrial Counter) -->
      <path d="M 75 54 L 86 10 L 106 10 L 117 54 L 104 54 L 101 40 L 91 40 L 88 54 Z M 93.5 33 L 98.5 33 Q 102 33 101 30.5 L 98.5 23.5 Q 96 20.5 93.5 23.5 L 91 30.5 Q 90 33 93.5 33 Z" />
      <!-- M -->
      <path d="M 122 54 L 122 10 L 137 10 L 145 31 L 153 10 L 168 10 L 168 54 L 156 54 L 156 25 L 149 40 L 141 40 L 134 25 L 134 54 Z" />
      <!-- DESIGNS Heavy Chamfered Plate (Balanced Spacing) -->
      <path d="M 192 7 L 392 7 L 402 17 L 402 47 L 392 57 L 192 57 L 182 47 L 182 17 Z" />
    </g>

    <!-- ========================================================================
         LAYER 2: TACTICAL ACCENT OUTLINE (Sage / Electric Green)
         ======================================================================== -->
    <g stroke="url(#td-accent-grad)" stroke-width="3.5" stroke-linejoin="round" stroke-miterlimit="2" fill="none">
      <!-- T -->
      <path d="M 12 10 L 50 10 L 50 23 L 37 23 L 37 54 L 25 54 L 25 23 L 12 23 Z" />
      <!-- I -->
      <path d="M 56 10 L 68 10 L 68 54 L 56 54 Z" />
      <!-- A -->
      <path d="M 75 54 L 86 10 L 106 10 L 117 54 L 104 54 L 101 40 L 91 40 L 88 54 Z M 93.5 33 L 98.5 33 Q 102 33 101 30.5 L 98.5 23.5 Q 96 20.5 93.5 23.5 L 91 30.5 Q 90 33 93.5 33 Z" />
      <!-- M -->
      <path d="M 122 54 L 122 10 L 137 10 L 145 31 L 153 10 L 168 10 L 168 54 L 156 54 L 156 25 L 149 40 L 141 40 L 134 25 L 134 54 Z" />
      <!-- DESIGNS Frame Accent -->
      <path d="M 192 7 L 392 7 L 402 17 L 402 47 L 392 57 L 192 57 L 182 47 L 182 17 Z" stroke-width="2.5" />
    </g>

    <!-- ========================================================================
         LAYER 3: FOREGROUND SOLID LETTERFORMS (Stark Crisp Fills)
         ======================================================================== -->
    <!-- TIAM Letterforms -->
    <path d="M 12 10 L 50 10 L 50 23 L 37 23 L 37 54 L 25 54 L 25 23 L 12 23 Z" fill="#ffffff" />
    <path d="M 56 10 L 68 10 L 68 54 L 56 54 Z" fill="#ffffff" />
    <path d="M 75 54 L 86 10 L 106 10 L 117 54 L 104 54 L 101 40 L 91 40 L 88 54 Z M 93.5 33 L 98.5 33 Q 102 33 101 30.5 L 98.5 23.5 Q 96 20.5 93.5 23.5 L 91 30.5 Q 90 33 93.5 33 Z" fill="#ffffff" fill-rule="evenodd" />
    <path d="M 122 54 L 122 10 L 137 10 L 145 31 L 153 10 L 168 10 L 168 54 L 156 54 L 156 25 L 149 40 L 141 40 L 134 25 L 134 54 Z" fill="#ffffff" />

    <!-- ========================================================================
         LAYER 4: DESIGNS PROMINENT BLOCK (ZZZ & 2XKO Punch)
         ======================================================================== -->
    <!-- Tactical Recessed Container Fill -->
    <path d="M 192 7 L 392 7 L 402 17 L 402 47 L 392 57 L 192 57 L 182 47 L 182 17 Z" fill="#141822" />

    <!-- ZZZ Bold Hazard Chevrons - Chunky, Proportionate & Tightly Coupled -->
    <g fill="url(#td-orange-grad)">
      <polygon points="200,19 210,19 203,43 193,43" />
      <polygon points="214,19 224,19 217,43 207,43" />
    </g>

    <!-- Large Bold Typography for DESIGNS (Tightly following '//') -->
    <text x="232" y="40.5" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="2.2" fill="#ffffff" text-anchor="start">DESIGNS</text>
    
    <!-- Right Telemetry Dot -->
    <circle cx="384" cy="19" r="3.5" fill="url(#td-accent-grad)" />
  </g>
</svg>
